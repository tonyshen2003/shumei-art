<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社团作品展示</title>
    <style>
        /* === Apple Design System 变量 === */
        :root {
            /* 色彩系统 - Apple Human Interface */
            --accent-color: #FF2D55; /* Apple Pink 系统红粉色 */
            --accent-color-secondary: #FF6B8A;
            --bg-primary: #F2F2F7; /* Apple 系统分组背景色 */
            --bg-secondary: #FFFFFF; /* 卡片/内容背景 */
            --bg-tertiary: #F9F9FB; /* 次要内容背景 */
            --label-primary: #000000; /* 主文本 */
            --label-secondary: #3C3C43; /* 次要文本（带透明度使用） */
            --label-tertiary: #8E8E93; /* 三级文本 */
            --separator-color: rgba(60, 60, 67, 0.12); /* 分割线 */
            --overlay-thin: rgba(255, 255, 255, 0.7);

            /* 圆角 - Apple 圆角规范 */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;

            /* 阴影 - Apple 柔和阴影 */
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.08);

            /* 间距 - 8px 基准 */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 28px;
            --space-3xl: 32px;

            /* 动效 - Apple 缓动曲线 */
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --duration-fast: 0.2s;
            --duration-normal: 0.35s;
            --duration-slow: 0.5s;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --accent-color: #FF375F;
                --accent-color-secondary: #FF6B8A;
                --bg-primary: #000000;
                --bg-secondary: #1C1C1E;
                --bg-tertiary: #2C2C2E;
                --label-primary: #FFFFFF;
                --label-secondary: rgba(235, 235, 245, 0.6);
                --label-tertiary: rgba(235, 235, 245, 0.3);
                --separator-color: rgba(84, 84, 88, 0.6);
                --overlay-thin: rgba(20, 20, 20, 0.75);
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
                --tag-bg: rgba(0, 0, 0, 0.6);
                --tag-text: #FFFFFF;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --tag-bg: rgba(0, 0, 0, 0.5);
                --tag-text: #FFFFFF;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-primary);
            color: var(--label-primary);
            padding-bottom: var(--space-2xl);
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        /* === 顶部导航栏 - Apple Style === */
        .detail-back-btn {
            background: none;
            border: none;
            font-size: 17px;
            font-weight: 400;
            color: var(--accent-color);
            cursor: pointer;
            padding: 8px 4px 12px;
            font-family: inherit;
            transition: opacity var(--duration-fast) var(--ease-out);
        }

        .detail-back-btn:active {
            opacity: 0.5;
        }

        /* === 分类 Tab - Apple Segmented Control Style === */
        .category-tabs {
            display: flex;
            padding: var(--space-lg) 20px var(--space-md);
            gap: var(--space-sm);
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--bg-primary);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 7px 16px;
            border-radius: 9px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--label-secondary);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .tab-btn.active {
            background: var(--bg-secondary);
            color: var(--label-primary);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .tab-btn:active {
            opacity: 0.7;
            transform: scale(0.97);
        }

        /* === 列表页容器 === */
        .view-container {
            padding: var(--space-lg) 20px;
            max-width: 840px;
            margin: 0 auto;
        }

        /* === 作品网格 - Apple Grid === */
        .works-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-xl);
        }

        @media (min-width: 640px) {
            .works-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-2xl) var(--space-xl);
            }
        }

        /* === 作品卡片 - Apple Card Style === */
        .work-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform var(--duration-normal) var(--ease-out),
                        box-shadow var(--duration-normal) var(--ease-out);
        }

        .work-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .work-card:active {
            transform: scale(0.98);
            transition-duration: var(--duration-fast);
        }

        .card-cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background-color: var(--bg-tertiary);
            overflow: hidden;
        }

        .card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--duration-slow) var(--ease-out);
        }

        .work-card:hover .card-cover {
            transform: scale(1.03);
        }

        .card-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: 0.01em;
        }

        .card-info {
            padding: var(--space-lg) 14px var(--space-md);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.4;
            color: var(--label-primary);
            letter-spacing: -0.01em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-desc {
            font-size: 13px;
            color: var(--label-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* === 详情/播放器页样式 === */
        #detail-view {
            display: none;
        }

        /* 视频容器 */
        .video-player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .video-player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .detail-content {
            margin-top: var(--space-2xl);
        }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: var(--space-lg);
            line-height: 1.3;
            letter-spacing: -0.02em;
            color: var(--label-primary);
        }

        /* 信息卡片组 - Apple Grouped Style */
        .info-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-lg) var(--space-xl);
            margin-bottom: var(--space-md);
            box-shadow: var(--shadow-sm);
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--label-tertiary);
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .section-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--label-primary);
            white-space: pre-wrap;
            letter-spacing: -0.01em;
        }

        /* 演职人员 - Apple List Style */
        .credits-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-top: var(--space-xs);
        }

        .credit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            padding: var(--space-sm) 0;
            border-bottom: 0.5px solid var(--separator-color);
        }

        .credit-item:last-child {
            border-bottom: none;
        }

        .credit-role {
            color: var(--label-secondary);
            font-weight: 400;
        }

        .credit-name {
            font-weight: 500;
            color: var(--label-primary);
            text-align: right;
            flex-shrink: 0;
            margin-left: var(--space-lg);
        }

        /* === 页面切换动画 === */
        .fade-enter {
            animation: fadeIn var(--duration-normal) var(--ease-out);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === 空状态 === */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            color: var(--label-tertiary);
            padding: 60px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- 列表视图 -->
    <div id="list-view">
        <!-- 分类 Tab 栏 -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">全部作品</button>
            <button class="tab-btn" onclick="filterCategory('original', this)">原创作品</button>
            <button class="tab-btn" onclick="filterCategory('digital', this)">数字媒体</button>
            <button class="tab-btn" onclick="filterCategory('campus', this)">校园传媒</button>
        </div>

        <div class="view-container">
            <div class="works-grid" id="worksGrid"></div>
        </div>
    </div>

    <!-- 详情/播放器视图 -->
    <div id="detail-view">
        <div class="view-container">
            <button class="detail-back-btn" onclick="showListView()">← 返回</button>
            <!-- 16:9 响应式视频播放器 -->
            <div class="video-player-container" id="playerWrapper"></div>

            <div class="detail-content">
                <h1 class="detail-title" id="detailTitle"></h1>

                <!-- 简介 -->
                <div class="info-section">
                    <div class="section-label">作品简介</div>
                    <div class="section-text" id="detailDesc"></div>
                </div>

                <!-- 活动介绍 -->
                <div class="info-section">
                    <div class="section-label">活动背景 / 介绍</div>
                    <div class="section-text" id="detailActivity"></div>
                </div>

                <!-- 演职人员 -->
                <div class="info-section">
                    <div class="section-label">演职人员 (Credits)</div>
                    <div class="credits-grid" id="detailCredits"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 【社团作品数据源】在这里增加或修改你的作品！
        // ==========================================
        const worksData = [
            {
                id: "1",
                category: "original", // 对应：original(原创作品), digital(数字媒体), campus(校园传媒)
                categoryName: "原创微电影",
                title: "爆肝559天，一群高中生将治愈故事拍成了短片｜树莓社原创微电影｜识茶记",
                cover: "276bb389037217dcacc5975db05b37aafb6fe791.jpg", // 封面图URL
                bilibiliSrc: "//player.bilibili.com/player.html?isOutside=true&aid=642082238&bvid=BV1EY4y1V7LL&cid=734935772&p=1",
                desc: "老墙业已斑驳，树干历经沧桑，惟新刷上漆的长椅显得格外鲜艳。而每当与好友一起喝着奶茶，走过树荫下静坐的长椅，仿佛总能看见四个坐在椅子上的少年、听见剧组成员吵吵闹闹的欢笑、想起那一段名为「识茶记」的、由奶茶系起的动人故事……\n主题曲：涙そうそう",
                activity: "2020-2021年苏州中学树莓社影视作品代表作。",
                credits: [
                    { role: "导演", name: "李令剑" },
                    { role: "编剧", name: "陈天一" },
                    { role: "制片", name: "沈孙丰" },
                    { role: "监制", name: "马雨璋" },
                    { role: "选角导演", name: "陈天一、徐杰、彭嘉仪、沈孙丰、李令剑、谭嘉怡" },
                    { role: "场记", name: "徐皓玥、彭嘉仪、任好" },
                    { role: "演员", name: "江昊林、金心远、沈彦希、钱宸、叶卓、张研南" },
                    { role: "摄影指导", name: "沈孙丰" },
                    { role: "摄影", name: "沈孙丰、马雨璋、朱奕、叶卓" },
                    { role: "摄影助理", name: "赵晴柔" },
                    { role: "灯光", name: "叶卓" },
                    { role: "录音", name: "何怿阳、张研南" },
                    { role: "混音", name: "顾衡庭" },
                    { role: "美术", name: "彭嘉仪、虞思辰" },
                    { role: "化妆", name: "李文博" },
                    { role: "剧照", name: "朱奕" },
                    { role: "剪辑", name: "沈孙丰、江长坤、刘欣怡" },
                    { role: "调色", name: "沈孙丰" },
                    { role: "场务", name: "范奕凡、杨乐天" }
                ]
            },
            {
                id: "2",
                category: "digital",
                categoryName: "数字媒体",
                title: "【数媒CG动画】《未来科技展演片头》",
                cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80",
                bilibiliSrc: "//player.bilibili.com/player.html?isOutside=true&aid=642082238&bvid=BV1EY4y1V7LL&cid=734935772&p=1",
                desc: "使用 Blender 与 AE 制作的三维视觉展演动画，展示数字艺术的独特性。",
                activity: "2024 校科技艺术节开幕式特邀展播视频。",
                credits: [
                    { role: "3D建模", name: "小明" },
                    { role: "特效/合成", name: "小红" },
                    { role: "音效设计", name: "小刚" }
                ]
            },
            {
                id: "3",
                category: "campus",
                categoryName: "校园传媒",
                title: "【校园新闻】2024社团招新晚会全程回顾",
                cover: "https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=600&q=80",
                bilibiliSrc: "//player.bilibili.com/player.html?isOutside=true&aid=642082238&bvid=BV1EY4y1V7LL&cid=734935772&p=1",
                desc: "记录了招新晚会精彩瞬间，包含多个社团的优秀节目集锦与采访。",
                activity: "校园传媒部日常采编记录，展现丰富多彩的大学社团生活。",
                credits: [
                    { role: "总策划", name: "社长" },
                    { role: "外采记者", name: "社员A, 社员B" },
                    { role: "后期包装", name: "传媒部" }
                ]
            }
        ];

        // ==========================================
        // 逻辑控制代码
        // ==========================================
        let currentCategory = 'all';

        // 初始化页面
        window.addEventListener('DOMContentLoaded', () => {
            renderWorksList(worksData);
        });

        // 渲染列表
        function renderWorksList(data) {
            const grid = document.getElementById('worksGrid');
            grid.innerHTML = '';

            const filteredData = currentCategory === 'all' 
                ? data 
                : data.filter(item => item.category === currentCategory);

            if (filteredData.length === 0) {
                grid.innerHTML = '<div class="empty-state">该分类下暂无作品</div>';
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.onclick = () => openDetailView(item.id);

                card.innerHTML = `
                    <div class="card-cover-wrapper">
                        <img class="card-cover" src="${item.cover}" alt="${item.title}" loading="lazy">
                        <span class="card-tag">${item.categoryName}</span>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 分类筛选
        function filterCategory(category, btnElement) {
            currentCategory = category;
            
            // 更新 Tab 选中状态
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            renderWorksList(worksData);
        }

        // 打开详情页
        function openDetailView(workId) {
            const work = worksData.find(item => item.id === workId);
            if (!work) return;

            // 填写详情信息
            document.getElementById('detailTitle').innerText = work.title;
            document.getElementById('detailDesc').innerText = work.desc;
            document.getElementById('detailActivity').innerText = work.activity;

            // 动态嵌入 B站 iFrame 播放器
            const playerWrapper = document.getElementById('playerWrapper');
            playerWrapper.innerHTML = `
                <iframe 
                    src="${work.bilibiliSrc}" 
                    scrolling="no" 
                    border="0" 
                    frameborder="no" 
                    framespacing="0" 
                    allowfullscreen="true">
                </iframe>
            `;

            // 渲染演职人员
            const creditsContainer = document.getElementById('detailCredits');
            creditsContainer.innerHTML = work.credits.map(c => `
                <div class="credit-item">
                    <span class="credit-role">${c.role}：</span>
                    <span class="credit-name">${c.name}</span>
                </div>
            `).join('');

            // 切换视图
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('detail-view').classList.remove('fade-enter');
            void document.getElementById('detail-view').offsetWidth;
            document.getElementById('detail-view').classList.add('fade-enter');

            // 滚动到顶部
            window.scrollTo(0, 0);
        }

        // 返回列表页
        function showListView() {
            // 清空播放器（停止视频播放）
            document.getElementById('playerWrapper').innerHTML = '';

            // 切换视图
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('list-view').classList.remove('fade-enter');
            void document.getElementById('list-view').offsetWidth;
            document.getElementById('list-view').classList.add('fade-enter');

            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
