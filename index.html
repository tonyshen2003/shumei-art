<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社团作品展示</title>
    <style>
        /* === Apple Design System 变量 === */
        :root {
            /* 色彩系统 - Apple Human Interface */
            --accent-color: #FF2D55; /* Apple Pink 系统红粉色 */
            --accent-color-secondary: #FF6B8A;
            --bg-primary: #F2F2F7; /* Apple 系统分组背景色 */
            --bg-secondary: #FFFFFF; /* 卡片/内容背景 */
            --bg-tertiary: #F9F9FB; /* 次要内容背景 */
            --label-primary: #000000; /* 主文本 */
            --label-secondary: #3C3C43; /* 次要文本（带透明度使用） */
            --label-tertiary: #8E8E93; /* 三级文本 */
            --separator-color: rgba(60, 60, 67, 0.12); /* 分割线 */
            --overlay-thin: rgba(255, 255, 255, 0.7);

            /* 圆角 - Apple 圆角规范 */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;

            /* 阴影 - Apple 柔和阴影 */
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.08);

            /* 间距 - 8px 基准 */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 28px;
            --space-3xl: 32px;

            /* 动效 - Apple 缓动曲线 */
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --duration-fast: 0.2s;
            --duration-normal: 0.35s;
            --duration-slow: 0.5s;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --accent-color: #FF375F;
                --accent-color-secondary: #FF6B8A;
                --bg-primary: #000000;
                --bg-secondary: #1C1C1E;
                --bg-tertiary: #2C2C2E;
                --label-primary: #FFFFFF;
                --label-secondary: rgba(235, 235, 245, 0.6);
                --label-tertiary: rgba(235, 235, 245, 0.3);
                --separator-color: rgba(84, 84, 88, 0.6);
                --overlay-thin: rgba(20, 20, 20, 0.75);
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
                --tag-bg: rgba(0, 0, 0, 0.6);
                --tag-text: #FFFFFF;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --tag-bg: rgba(0, 0, 0, 0.5);
                --tag-text: #FFFFFF;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-primary);
            color: var(--label-primary);
            padding-bottom: var(--space-2xl);
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        /* App 使用原生筛选器时，隐藏网页自带的筛选 UI */
        body.native-filter-tabs .category-tabs {
            display: none;
        }

        body.native-filter-search .search-wrap {
            display: none;
        }

        /* === 顶部导航栏 - Apple Style === */
        .detail-back-btn {
            background: none;
            border: none;
            font-size: 17px;
            font-weight: 400;
            color: var(--accent-color);
            cursor: pointer;
            padding: 8px 4px 12px;
            font-family: inherit;
            transition: opacity var(--duration-fast) var(--ease-out);
        }

        .detail-back-btn:active {
            opacity: 0.5;
        }

        .detail-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-sm);
        }

        .share-btn {
            background: var(--bg-tertiary);
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--label-primary);
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 9px;
            font-family: inherit;
            transition: opacity var(--duration-fast) var(--ease-out),
                        background var(--duration-fast) var(--ease-out),
                        color var(--duration-fast) var(--ease-out);
        }

        .share-btn:hover {
            background: var(--bg-secondary);
        }

        .share-btn:active {
            opacity: 0.7;
        }

        .share-btn.copied {
            color: var(--accent-color);
        }

        /* === 页头 - Apple Header Style === */
        .site-header {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-2xl) max(20px, env(safe-area-inset-left)) var(--space-lg) max(20px, env(safe-area-inset-right));
            text-align: center;
        }

        .site-eyebrow {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--label-tertiary);
            margin-bottom: 8px;
        }

        .site-title {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--label-primary);
            line-height: 1.15;
        }

        .site-subtitle {
            font-size: 14px;
            color: var(--label-secondary);
            margin-top: 8px;
            line-height: 1.5;
        }

        .search-wrap {
            max-width: 460px;
            margin: var(--space-lg) auto 0;
        }

        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: var(--bg-tertiary);
            color: var(--label-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-out),
                        box-shadow var(--duration-fast) var(--ease-out),
                        background var(--duration-fast) var(--ease-out);
        }

        .search-input::placeholder {
            color: var(--label-tertiary);
        }

        .search-input:focus {
            background: var(--bg-secondary);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(255, 45, 85, 0.12);
        }

        @media (min-width: 768px) {
            .site-title {
                font-size: 44px;
            }

            .site-subtitle {
                font-size: 16px;
            }
        }

        /* === 分类 Tab - Apple Segmented Control Style === */
        .category-tabs {
            display: flex;
            padding: var(--space-lg) max(20px, env(safe-area-inset-left)) var(--space-md) max(20px, env(safe-area-inset-right));
            gap: var(--space-sm);
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--bg-primary);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 7px 16px;
            border-radius: 9px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--label-secondary);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .tab-btn.active {
            background: var(--bg-secondary);
            color: var(--label-primary);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .tab-count {
            display: inline-block;
            margin-left: 5px;
            font-size: 11px;
            font-weight: 500;
            color: var(--label-tertiary);
            font-variant-numeric: tabular-nums;
        }

        .tab-btn.active .tab-count {
            color: var(--label-secondary);
        }

        .tab-btn:active {
            opacity: 0.7;
            transform: scale(0.97);
        }

        .work-card:focus-visible,
        .tab-btn:focus-visible,
        .detail-back-btn:focus-visible,
        .detail-nav-btn:focus-visible,
        .share-btn:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        @media (min-width: 768px) {
            .category-tabs {
                justify-content: center;
            }

            .tab-btn {
                padding: 8px 20px;
                font-size: 15px;
            }
        }

        /* === 列表页容器 === */
        .view-container {
            padding: var(--space-lg) max(20px, env(safe-area-inset-left)) var(--space-lg) max(20px, env(safe-area-inset-right));
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (min-width: 1440px) {
            .view-container {
                max-width: 1400px;
            }
        }

        /* === 作品网格 - Apple Grid === */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-xl);
        }

        @media (min-width: 640px) {
            .works-grid {
                gap: var(--space-2xl) var(--space-xl);
            }
        }

        /* === 作品卡片 - Apple Card Style === */
        .work-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform var(--duration-normal) var(--ease-out),
                        box-shadow var(--duration-normal) var(--ease-out);
        }

        .work-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .work-card:active {
            transform: scale(0.98);
            transition-duration: var(--duration-fast);
        }

        .card-cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background-color: var(--bg-tertiary);
            overflow: hidden;
        }

        .card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--duration-slow) var(--ease-out);
        }

        .work-card:hover .card-cover {
            transform: scale(1.03);
        }

        .card-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--duration-fast) var(--ease-out);
            pointer-events: none;
        }

        .card-play svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            margin-left: 2px;
        }

        @media (hover: hover) {
            .work-card:hover .card-play,
            .work-card:focus-visible .card-play {
                opacity: 1;
            }
        }

        .card-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: 0.01em;
        }

        .card-info {
            padding: var(--space-lg) 14px var(--space-md);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.4;
            color: var(--label-primary);
            letter-spacing: -0.01em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (min-width: 1024px) {
            .card-title {
                font-size: 17px;
            }
        }

        .card-desc {
            font-size: 13px;
            color: var(--label-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            margin-top: 6px;
            font-size: 12px;
            color: var(--label-tertiary);
            letter-spacing: 0.01em;
        }

        /* === 详情/播放器页样式 === */
        #detail-view {
            display: none;
        }

        /* 视频容器 */
        .video-player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .video-player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* === 音频/广播播放器 === */
        .audio-player-container {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-md);
        }

        .audio-cover-wrapper {
            width: 100%;
            aspect-ratio: 1;
            max-width: 320px;
            margin: 0 auto var(--space-xl);
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-tertiary);
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .audio-cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s var(--ease-out);
        }

        .audio-cover-wrapper.playing img {
            transform: scale(1.05);
        }

        .audio-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent-color);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.04em;
        }

        .audio-info {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .audio-episode {
            font-size: 13px;
            color: var(--label-tertiary);
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }

        .audio-player-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--label-primary);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .audio-player-subtitle {
            font-size: 14px;
            color: var(--label-secondary);
        }

        .audio-progress-container {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }

        .audio-time {
            font-size: 12px;
            color: var(--label-tertiary);
            font-variant-numeric: tabular-nums;
            min-width: 36px;
        }

        .audio-time.current {
            text-align: left;
        }

        .audio-time.duration {
            text-align: right;
        }

        .audio-progress-bar {
            flex: 1;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: height 0.15s ease;
        }

        .audio-progress-bar:hover {
            height: 8px;
        }

        .audio-progress-bar:hover .audio-progress-fill {
            background: var(--accent-color-secondary);
        }

        .audio-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2xl);
        }

        .audio-ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--label-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all var(--duration-fast) var(--ease-out);
            font-family: inherit;
        }

        .audio-ctrl-btn:active {
            transform: scale(0.92);
        }

        .audio-ctrl-btn.speed-btn {
            width: 36px;
            height: 36px;
            font-size: 13px;
            font-weight: 600;
            color: var(--label-secondary);
        }

        .audio-ctrl-btn.speed-btn.active {
            color: var(--accent-color);
        }

        .audio-ctrl-btn.rewind-btn {
            width: 36px;
            height: 36px;
            color: var(--label-secondary);
        }

        .audio-ctrl-btn.rewind-btn:hover {
            color: var(--accent-color);
        }

        .audio-play-btn {
            width: 64px;
            height: 64px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(255, 45, 85, 0.3);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .audio-play-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 45, 85, 0.4);
            transform: scale(1.04);
        }

        .audio-play-btn:active {
            transform: scale(0.96);
        }

        .audio-play-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        @media (min-width: 768px) {
            .audio-player-container {
                display: grid;
                grid-template-columns: 280px 1fr;
                grid-template-areas:
                    "cover info"
                    "cover progress"
                    "cover controls";
                gap: var(--space-md) var(--space-xl);
                align-items: center;
            }

            .audio-cover-wrapper {
                grid-area: cover;
                margin: 0;
            }

            .audio-info {
                grid-area: info;
                text-align: left;
                margin-bottom: 0;
            }

            .audio-progress-container {
                grid-area: progress;
                margin-bottom: 0;
            }

            .audio-controls {
                grid-area: controls;
                justify-content: flex-start;
                gap: var(--space-lg);
            }
        }

        @media (prefers-color-scheme: dark) {
            .audio-ctrl-btn.speed-btn.active {
                color: var(--accent-color);
            }
        }

        .detail-content {
            margin-top: var(--space-2xl);
            max-width: 920px;
            margin-left: auto;
            margin-right: auto;
        }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.3;
            letter-spacing: -0.02em;
            color: var(--label-primary);
        }

        .detail-meta {
            font-size: 13px;
            color: var(--label-tertiary);
            margin-bottom: var(--space-lg);
            letter-spacing: 0.01em;
        }

        @media (min-width: 768px) {
            .detail-title {
                font-size: 28px;
            }
        }

        /* 上一个 / 下一个作品 */
        .detail-nav {
            display: flex;
            justify-content: space-between;
            gap: var(--space-md);
            margin-top: var(--space-2xl);
        }

        .detail-nav-btn {
            appearance: none;
            -webkit-appearance: none;
            background: var(--bg-secondary);
            border: 1px solid var(--separator-color);
            color: var(--label-primary);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: background var(--duration-fast) var(--ease-out),
                        opacity var(--duration-fast) var(--ease-out);
        }

        .detail-nav-btn:hover:not(:disabled) {
            background: var(--bg-tertiary);
        }

        .detail-nav-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        /* 信息卡片组 - Apple Grouped Style */
        .info-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-lg) var(--space-xl);
            margin-bottom: var(--space-md);
            box-shadow: var(--shadow-sm);
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--label-tertiary);
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .section-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--label-primary);
            white-space: pre-wrap;
            letter-spacing: -0.01em;
        }

        /* 演职人员 - Apple List Style */
        .credits-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-top: var(--space-xs);
        }

        .credit-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: var(--space-md) 0;
            border-bottom: 0.5px solid var(--separator-color);
        }

        .credit-item:last-child {
            border-bottom: none;
        }

        .credit-role {
            font-size: 12px;
            font-weight: 500;
            color: var(--label-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .credit-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--label-primary);
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        /* === 页面切换动画 === */
        .fade-enter {
            animation: fadeIn var(--duration-normal) var(--ease-out);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === 空状态 === */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            color: var(--label-tertiary);
            padding: 60px 0;
            font-size: 15px;
        }

        .footer-link {
            text-align: center;
            padding: var(--space-2xl) 0 var(--space-lg);
            font-size: 12px;
        }

        .footer-link a {
            color: var(--label-tertiary);
            text-decoration: none;
            transition: color var(--duration-fast) var(--ease-out);
        }

        .footer-link a:hover {
            color: var(--label-secondary);
        }
    </style>
</head>
<body>

    <!-- 列表视图 -->
    <div id="list-view">
        <!-- 页头 -->
        <header class="site-header">
            <p class="site-eyebrow">SHUMEI ART</p>
            <h1 class="site-title">树莓社 · 作品集</h1>
            <div class="search-wrap">
                <input class="search-input" id="searchInput" type="search" placeholder="搜索作品标题或简介" autocomplete="off" enterkeyhint="search">
            </div>
        </header>

        <!-- 分类 Tab 栏 -->
        <div class="category-tabs">
            <button class="tab-btn active" data-category="all" onclick="filterCategory('all', this)">全部作品<span class="tab-count"></span></button>
            <button class="tab-btn" data-category="original" onclick="filterCategory('original', this)">原创作品<span class="tab-count"></span></button>
            <button class="tab-btn" data-category="events" onclick="filterCategory('events', this)">校园活动<span class="tab-count"></span></button>
            <button class="tab-btn" data-category="sports" onclick="filterCategory('sports', this)">体育赛事<span class="tab-count"></span></button>
            <button class="tab-btn" data-category="music" onclick="filterCategory('music', this)">音乐舞蹈<span class="tab-count"></span></button>
            <button class="tab-btn" data-category="news" onclick="filterCategory('news', this)">校园新闻<span class="tab-count"></span></button>
            <button class="tab-btn" data-category="digital" onclick="filterCategory('digital', this)">数字创意<span class="tab-count"></span></button>
        </div>

        <div class="view-container">
            <div class="works-grid" id="worksGrid"></div>
        </div>
    </div>

    <!-- 详情/播放器视图 -->
    <div id="detail-view">
        <div class="view-container">
            <div class="detail-top-bar">
                <button class="detail-back-btn" onclick="showListView()">← 返回</button>
                <button class="share-btn" id="shareBtn" title="复制当前作品链接">分享链接</button>
            </div>
            <!-- 16:9 响应式视频播放器 -->
            <div class="video-player-container" id="playerWrapper"></div>

            <div class="detail-content">
                <h1 class="detail-title" id="detailTitle"></h1>
                <div class="detail-meta" id="detailMeta"></div>

                <!-- 简介 -->
                <div class="info-section">
                    <div class="section-label">作品简介</div>
                    <div class="section-text" id="detailDesc"></div>
                </div>

                <!-- 活动介绍 -->
                <div class="info-section">
                    <div class="section-label">活动背景 / 介绍</div>
                    <div class="section-text" id="detailActivity"></div>
                </div>

                <!-- 演职人员 -->
                <div class="info-section">
                    <div class="section-label">演职人员 (Credits)</div>
                    <div class="credits-grid" id="detailCredits"></div>
                </div>

                <!-- 上一个 / 下一个作品 -->
                <div class="detail-nav">
                    <button class="detail-nav-btn" id="prevWorkBtn">← 上一个</button>
                    <button class="detail-nav-btn" id="nextWorkBtn">下一个 →</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-link"><a href="https://tonyshen2003.github.io/shumei-art/" target="_blank" rel="noopener">备用线路</a></div>

    <script>
        // ==========================================
        // 【社团作品数据源】在这里增加或修改你的作品！
        // ==========================================
        let worksData = [];

        // CSV 解析器（支持引号转义，兼容标准的 CSV 表格）
        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; }
                        else inQuotes = false;
                    } else field += c;
                } else if (c === '"') {
                    inQuotes = true;
                } else if (c === ',') {
                    row.push(field); field = '';
                } else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i + 1] === '\n') i++;
                    if (field !== '' || row.length > 0) { row.push(field); rows.push(row); row = []; field = ''; }
                } else field += c;
            }
            if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
            return rows;
        }

        // 从 works.csv 表格加载作品数据（新作品只需在表格里加一行）
        async function loadWorks() {
            const res = await fetch('works.csv');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const text = await res.text();
            const rows = parseCSV(text);
            const header = rows[0].map(h => h.trim());
            const idx = Object.fromEntries(header.map((h, i) => [h, i]));
            return rows.slice(1).map(r => {
                const get = (k) => r[idx[k]] === undefined ? '' : r[idx[k]].trim();
                return {
                    id: get('id'), type: get('type'), category: get('category'),
                    categoryName: get('categoryName'), title: get('title'),
                    cover: get('cover'), bilibiliSrc: get('bilibiliSrc'),
                    audioSrc: get('audioSrc'), episodeDate: get('episodeDate'),
                    duration: get('duration'),
                    desc: get('desc').replace(/\\n/g, '\n'),
                    activity: get('activity').replace(/\\n/g, '\n'),
                    credits: get('credits') ? get('credits').split('|').filter(Boolean).map(c => {
                        const i = c.indexOf(':');
                        return { role: c.slice(0, i), name: c.slice(i + 1) };
                    }) : []
                };
            }).filter(w => w.id !== '');
        }


        // ==========================================
        // 逻辑控制代码
        // ==========================================
        let currentCategory = 'all';
        let currentSearch = '';
        let listScrollY = 0;
        let currentWorkId = null;

        // 初始化页面
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                worksData = await loadWorks();
            } catch (err) {
                console.error('加载 works.csv 失败，请确认文件存在并通过 http 访问', err);
            }
            updateTabCounts();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    currentSearch = searchInput.value;
                    renderWorksList(worksData);
                });
            }

            const shareBtn = document.getElementById('shareBtn');
            if (shareBtn) {
                shareBtn.addEventListener('click', async () => {
                    const url = location.href;
                    try {
                        await navigator.clipboard.writeText(url);
                    } catch (err) {
                        const textarea = document.createElement('textarea');
                        textarea.value = url;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        textarea.remove();
                    }
                    shareBtn.textContent = '已复制';
                    shareBtn.classList.add('copied');
                    setTimeout(() => {
                        shareBtn.textContent = '分享链接';
                        shareBtn.classList.remove('copied');
                    }, 1600);
                });
            }

            window.addEventListener('hashchange', handleHashChange);
            window.addEventListener('popstate', handleHashChange);
            renderWorksList(worksData);
            handleHashChange();
        });

        // 从 URL Hash 中解析作品 ID（形如 #/work/123）
        function getWorkIdFromHash() {
            const match = (location.hash || '').match(/^#\/work\/(\d+)$/);
            return match ? match[1] : null;
        }

        // 响应浏览器前进 / 后退 / 直接打开分享链接
        function handleHashChange() {
            const workId = getWorkIdFromHash();
            if (workId) {
                if (workId !== currentWorkId) openDetailView(workId);
            } else if (currentWorkId) {
                showListView();
            }
        }

        // 更新分类 Tab 的作品数量
        function updateTabCounts() {
            const counts = { all: worksData.length };
            worksData.forEach(work => {
                counts[work.category] = (counts[work.category] || 0) + 1;
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const category = btn.getAttribute('data-category') || 'all';
                const countEl = btn.querySelector('.tab-count');
                if (countEl) countEl.textContent = counts[category] || 0;
                btn.setAttribute('aria-pressed', String(btn.classList.contains('active')));
            });
        }

        // 渲染列表
        function renderWorksList(data) {
            const grid = document.getElementById('worksGrid');
            grid.innerHTML = '';

            const sortedData = [...data].sort((a, b) => workDateValue(b) - workDateValue(a));
            const query = (currentSearch || '').trim().toLowerCase();
            const filteredData = sortedData.filter(item => {
                if (currentCategory !== 'all' && item.category !== currentCategory) return false;
                if (!query) return true;
                return (item.title + ' ' + item.desc).toLowerCase().includes(query);
            });

            if (filteredData.length === 0) {
                grid.innerHTML = `<div class="empty-state">${query ? '没有找到相关作品' : '该分类下暂无作品'}</div>`;
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', '查看作品：' + item.title);
                card.onclick = () => openDetailView(item.id);
                card.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openDetailView(item.id);
                    }
                };

                card.innerHTML = `
                    <div class="card-cover-wrapper">
                        <img class="card-cover" src="${item.cover}" alt="${item.title}" loading="lazy" decoding="async">
                        <span class="card-tag">${item.categoryName}</span>
                        <span class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                        <div class="card-meta">${[item.episodeDate, item.duration].filter(Boolean).join(' · ')}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 从中文日期（如 2026年6月23日）解析时间戳，用于倒序排列
        function workDateValue(work) {
            const match = (work.episodeDate || '').match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
            return match ? new Date(+match[1], +match[2] - 1, +match[3]).getTime() : 0;
        }

        // 分类筛选
        function filterCategory(category, btnElement) {
            currentCategory = category;
            
            // 更新 Tab 选中状态
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.setAttribute('aria-pressed', String(btn.classList.contains('active'))));

            renderWorksList(worksData);
        }

        let currentAudio = null;

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' + s : s}`;
        }

        function renderAudioPlayer(work) {
            const playerWrapper = document.getElementById('playerWrapper');
            playerWrapper.className = 'audio-player-container';
            playerWrapper.innerHTML = `
                <div class="audio-cover-wrapper" id="audioCoverWrapper">
                    <img src="${work.cover}" alt="${work.title}">
                    <div class="audio-badge">广播</div>
                </div>
                <div class="audio-info">
                    <div class="audio-episode">${work.episodeDate || ''}</div>
                    <div class="audio-player-title">${work.title}</div>
                    <div class="audio-player-subtitle">${work.duration || ''}</div>
                </div>
                <div class="audio-progress-container">
                    <span class="audio-time current" id="audioCurrentTime">0:00</span>
                    <div class="audio-progress-bar" id="audioProgressBar">
                        <div class="audio-progress-fill" id="audioProgressFill"></div>
                    </div>
                    <span class="audio-time duration" id="audioDuration">0:00</span>
                </div>
                <div class="audio-controls">
                    <button class="audio-ctrl-btn speed-btn" id="speedBtn" data-speed="1">1x</button>
                    <button class="audio-play-btn" id="audioPlayBtn">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="audio-ctrl-btn rewind-btn" id="rewindBtn" title="后退15秒">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9"/>
                            <polyline points="3 4 3 10 9 10"/>
                        </svg>
                    </button>
                </div>
                <audio id="audioElement" src="${work.audioSrc}" preload="metadata"></audio>
            `;

            const audio = document.getElementById('audioElement');
            const playBtn = document.getElementById('audioPlayBtn');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const progressBar = document.getElementById('audioProgressBar');
            const progressFill = document.getElementById('audioProgressFill');
            const currentTimeEl = document.getElementById('audioCurrentTime');
            const durationEl = document.getElementById('audioDuration');
            const speedBtn = document.getElementById('speedBtn');
            const rewindBtn = document.getElementById('rewindBtn');
            const coverWrapper = document.getElementById('audioCoverWrapper');

            if (currentAudio && currentAudio !== audio) {
                currentAudio.pause();
            }
            currentAudio = audio;

            audio.addEventListener('loadedmetadata', () => {
                durationEl.innerText = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.innerText = formatTime(audio.currentTime);
            });

            audio.addEventListener('play', () => {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                coverWrapper.classList.add('playing');
            });

            audio.addEventListener('pause', () => {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                coverWrapper.classList.remove('playing');
            });

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            });

            progressBar.addEventListener('click', (e) => {
                const rect = progressBar.getBoundingClientRect();
                const ratio = (e.clientX - rect.left) / rect.width;
                audio.currentTime = ratio * audio.duration;
            });

            const speeds = [1, 1.25, 1.5, 2];
            let speedIndex = 0;
            speedBtn.addEventListener('click', () => {
                speedIndex = (speedIndex + 1) % speeds.length;
                const newSpeed = speeds[speedIndex];
                audio.playbackRate = newSpeed;
                speedBtn.innerText = newSpeed + 'x';
                speedBtn.classList.toggle('active', newSpeed !== 1);
            });

            rewindBtn.addEventListener('click', () => {
                audio.currentTime = Math.max(0, audio.currentTime - 15);
            });
        }

        function renderVideoPlayer(work) {
            const playerWrapper = document.getElementById('playerWrapper');
            playerWrapper.className = 'video-player-container';
            playerWrapper.innerHTML = `
                <iframe 
                    src="${work.bilibiliSrc}" 
                    scrolling="no" 
                    border="0" 
                    frameborder="no" 
                    framespacing="0" 
                    allowfullscreen="true">
                </iframe>
            `;
        }

        // 打开详情页
        function openDetailView(workId) {
            const work = worksData.find(item => item.id === workId);
            if (!work) return;

            currentWorkId = work.id;

            // 记住进入详情前的列表滚动位置
            listScrollY = window.scrollY;

            // 更新地址栏，方便分享
            if (getWorkIdFromHash() !== work.id) {
                location.hash = '#/work/' + work.id;
            }

            // 填写详情信息
            document.getElementById('detailTitle').innerText = work.title;
            document.getElementById('detailDesc').innerText = work.desc;
            document.getElementById('detailActivity').innerText = work.activity;
            document.getElementById('detailMeta').innerText = [work.episodeDate, work.duration ? '时长 ' + work.duration : ''].filter(Boolean).join(' · ');

            // 隐藏没有内容的区块
            const setSectionVisible = (id, visible) => {
                const section = document.getElementById(id).closest('.info-section');
                if (section) section.style.display = visible ? '' : 'none';
            };
            setSectionVisible('detailDesc', Boolean(work.desc && work.desc.trim()));
            setSectionVisible('detailActivity', Boolean(work.activity && work.activity.trim()));
            setSectionVisible('detailCredits', work.credits.length > 0);

            // 根据类型渲染播放器
            if (work.type === 'audio') {
                renderAudioPlayer(work);
            } else {
                renderVideoPlayer(work);
            }

            // 渲染演职人员
            const creditsContainer = document.getElementById('detailCredits');
            creditsContainer.innerHTML = work.credits.map(c => `
                <div class="credit-item">
                    <span class="credit-role">${c.role}</span>
                    <span class="credit-name">${c.name}</span>
                </div>
            `).join('');

            // 上一个 / 下一个作品
            const sortedWorks = [...worksData].sort((a, b) => workDateValue(b) - workDateValue(a));
            const currentIndex = sortedWorks.findIndex(item => item.id === work.id);
            const prevWork = sortedWorks[currentIndex - 1];
            const nextWork = sortedWorks[currentIndex + 1];
            const prevBtn = document.getElementById('prevWorkBtn');
            const nextBtn = document.getElementById('nextWorkBtn');
            prevBtn.disabled = !prevWork;
            nextBtn.disabled = !nextWork;
            prevBtn.onclick = () => prevWork && openDetailView(prevWork.id);
            nextBtn.onclick = () => nextWork && openDetailView(nextWork.id);

            // 切换视图
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('detail-view').classList.remove('fade-enter');
            void document.getElementById('detail-view').offsetWidth;
            document.getElementById('detail-view').classList.add('fade-enter');

            // 滚动到顶部
            window.scrollTo(0, 0);
        }

        // 返回列表页
        function showListView() {
            currentWorkId = null;

            // 清掉地址栏的作品 Hash，但不新增历史记录
            try {
                history.replaceState(null, '', location.pathname + location.search);
            } catch (err) {
                location.hash = '';
            }

            // 停止音频播放
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            // 清空播放器
            document.getElementById('playerWrapper').innerHTML = '';

            // 切换视图
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('list-view').classList.remove('fade-enter');
            void document.getElementById('list-view').offsetWidth;
            document.getElementById('list-view').classList.add('fade-enter');

            // 恢复进入详情前的滚动位置
            requestAnimationFrame(() => {
                window.scrollTo(0, listScrollY);
            });
        }

        // ==========================================
        // App 原生筛选器桥接接口
        // App 通过 evaluateJavaScript 调用：
        //   window.ShumeiBridge.setCategory('music')
        //   window.ShumeiBridge.setSearch('毕业典礼')
        //   window.ShumeiBridge.hideTabs(true)
        //   window.ShumeiBridge.hideSearch(true)
        // ==========================================
        window.ShumeiBridge = {
            setCategory(category) {
                const btn = document.querySelector(`.tab-btn[data-category="${category}"]`);
                if (!btn) return false;
                filterCategory(category, btn);
                return true;
            },
            setSearch(text) {
                currentSearch = String(text || '');
                const input = document.getElementById('searchInput');
                if (input && input.value !== currentSearch) {
                    input.value = currentSearch;
                }
                renderWorksList(worksData);
                return true;
            },
            hideTabs(hidden) {
                document.body.classList.toggle('native-filter-tabs', !!hidden);
            },
            hideSearch(hidden) {
                document.body.classList.toggle('native-filter-search', !!hidden);
            },
            getState() {
                return { category: currentCategory, search: currentSearch };
            }
        };

        // 通知 App 网页桥接已就绪（可选，App 端注册名为 shumeiFilter 的 handler 即可收到）
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.shumeiFilter) {
            window.webkit.messageHandlers.shumeiFilter.postMessage({ type: 'ready' });
        }
    </script>
</body>
</html>
