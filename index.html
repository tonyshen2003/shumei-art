<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社团作品展示</title>
    <style>
        /* === Apple Design System 变量 === */
        :root {
            /* 色彩系统 - Apple Human Interface */
            --accent-color: #FF2D55; /* Apple Pink 系统红粉色 */
            --accent-color-secondary: #FF6B8A;
            --bg-primary: #F2F2F7; /* Apple 系统分组背景色 */
            --bg-secondary: #FFFFFF; /* 卡片/内容背景 */
            --bg-tertiary: #F9F9FB; /* 次要内容背景 */
            --label-primary: #000000; /* 主文本 */
            --label-secondary: #3C3C43; /* 次要文本（带透明度使用） */
            --label-tertiary: #8E8E93; /* 三级文本 */
            --separator-color: rgba(60, 60, 67, 0.12); /* 分割线 */
            --overlay-thin: rgba(255, 255, 255, 0.7);

            /* 圆角 - Apple 圆角规范 */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;

            /* 阴影 - Apple 柔和阴影 */
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.08);

            /* 间距 - 8px 基准 */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 28px;
            --space-3xl: 32px;

            /* 动效 - Apple 缓动曲线 */
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --duration-fast: 0.2s;
            --duration-normal: 0.35s;
            --duration-slow: 0.5s;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --accent-color: #FF375F;
                --accent-color-secondary: #FF6B8A;
                --bg-primary: #000000;
                --bg-secondary: #1C1C1E;
                --bg-tertiary: #2C2C2E;
                --label-primary: #FFFFFF;
                --label-secondary: rgba(235, 235, 245, 0.6);
                --label-tertiary: rgba(235, 235, 245, 0.3);
                --separator-color: rgba(84, 84, 88, 0.6);
                --overlay-thin: rgba(20, 20, 20, 0.75);
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
                --tag-bg: rgba(0, 0, 0, 0.6);
                --tag-text: #FFFFFF;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --tag-bg: rgba(0, 0, 0, 0.5);
                --tag-text: #FFFFFF;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-primary);
            color: var(--label-primary);
            padding-bottom: var(--space-2xl);
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        /* === 顶部导航栏 - Apple Style === */
        .detail-back-btn {
            background: none;
            border: none;
            font-size: 17px;
            font-weight: 400;
            color: var(--accent-color);
            cursor: pointer;
            padding: 8px 4px 12px;
            font-family: inherit;
            transition: opacity var(--duration-fast) var(--ease-out);
        }

        .detail-back-btn:active {
            opacity: 0.5;
        }

        /* === 分类 Tab - Apple Segmented Control Style === */
        .category-tabs {
            display: flex;
            padding: var(--space-lg) 20px var(--space-md);
            gap: var(--space-sm);
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--bg-primary);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 7px 16px;
            border-radius: 9px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--label-secondary);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .tab-btn.active {
            background: var(--bg-secondary);
            color: var(--label-primary);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .tab-btn:active {
            opacity: 0.7;
            transform: scale(0.97);
        }

        /* === 列表页容器 === */
        .view-container {
            padding: var(--space-lg) 20px;
            max-width: 840px;
            margin: 0 auto;
        }

        /* === 作品网格 - Apple Grid === */
        .works-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-xl);
        }

        @media (min-width: 640px) {
            .works-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-2xl) var(--space-xl);
            }
        }

        /* === 作品卡片 - Apple Card Style === */
        .work-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform var(--duration-normal) var(--ease-out),
                        box-shadow var(--duration-normal) var(--ease-out);
        }

        .work-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .work-card:active {
            transform: scale(0.98);
            transition-duration: var(--duration-fast);
        }

        .card-cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background-color: var(--bg-tertiary);
            overflow: hidden;
        }

        .card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--duration-slow) var(--ease-out);
        }

        .work-card:hover .card-cover {
            transform: scale(1.03);
        }

        .card-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: 0.01em;
        }

        .card-info {
            padding: var(--space-lg) 14px var(--space-md);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.4;
            color: var(--label-primary);
            letter-spacing: -0.01em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-desc {
            font-size: 13px;
            color: var(--label-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* === 详情/播放器页样式 === */
        #detail-view {
            display: none;
        }

        /* 视频容器 */
        .video-player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .video-player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* === 音频/广播播放器 === */
        .audio-player-container {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-md);
        }

        .audio-cover-wrapper {
            width: 100%;
            aspect-ratio: 1;
            max-width: 320px;
            margin: 0 auto var(--space-xl);
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-tertiary);
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .audio-cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s var(--ease-out);
        }

        .audio-cover-wrapper.playing img {
            transform: scale(1.05);
        }

        .audio-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent-color);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.04em;
        }

        .audio-info {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .audio-episode {
            font-size: 13px;
            color: var(--label-tertiary);
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }

        .audio-player-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--label-primary);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .audio-player-subtitle {
            font-size: 14px;
            color: var(--label-secondary);
        }

        .audio-progress-container {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }

        .audio-time {
            font-size: 12px;
            color: var(--label-tertiary);
            font-variant-numeric: tabular-nums;
            min-width: 36px;
        }

        .audio-time.current {
            text-align: left;
        }

        .audio-time.duration {
            text-align: right;
        }

        .audio-progress-bar {
            flex: 1;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: height 0.15s ease;
        }

        .audio-progress-bar:hover {
            height: 8px;
        }

        .audio-progress-bar:hover .audio-progress-fill {
            background: var(--accent-color-secondary);
        }

        .audio-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2xl);
        }

        .audio-ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--label-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all var(--duration-fast) var(--ease-out);
            font-family: inherit;
        }

        .audio-ctrl-btn:active {
            transform: scale(0.92);
        }

        .audio-ctrl-btn.speed-btn {
            width: 36px;
            height: 36px;
            font-size: 13px;
            font-weight: 600;
            color: var(--label-secondary);
        }

        .audio-ctrl-btn.speed-btn.active {
            color: var(--accent-color);
        }

        .audio-ctrl-btn.rewind-btn {
            width: 36px;
            height: 36px;
            color: var(--label-secondary);
        }

        .audio-ctrl-btn.rewind-btn:hover {
            color: var(--accent-color);
        }

        .audio-play-btn {
            width: 64px;
            height: 64px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(255, 45, 85, 0.3);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .audio-play-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 45, 85, 0.4);
            transform: scale(1.04);
        }

        .audio-play-btn:active {
            transform: scale(0.96);
        }

        .audio-play-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        @media (prefers-color-scheme: dark) {
            .audio-ctrl-btn.speed-btn.active {
                color: var(--accent-color);
            }
        }

        .detail-content {
            margin-top: var(--space-2xl);
        }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: var(--space-lg);
            line-height: 1.3;
            letter-spacing: -0.02em;
            color: var(--label-primary);
        }

        /* 信息卡片组 - Apple Grouped Style */
        .info-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-lg) var(--space-xl);
            margin-bottom: var(--space-md);
            box-shadow: var(--shadow-sm);
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--label-tertiary);
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .section-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--label-primary);
            white-space: pre-wrap;
            letter-spacing: -0.01em;
        }

        /* 演职人员 - Apple List Style */
        .credits-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-top: var(--space-xs);
        }

        .credit-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: var(--space-md) 0;
            border-bottom: 0.5px solid var(--separator-color);
        }

        .credit-item:last-child {
            border-bottom: none;
        }

        .credit-role {
            font-size: 12px;
            font-weight: 500;
            color: var(--label-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .credit-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--label-primary);
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        /* === 页面切换动画 === */
        .fade-enter {
            animation: fadeIn var(--duration-normal) var(--ease-out);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === 空状态 === */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            color: var(--label-tertiary);
            padding: 60px 0;
            font-size: 15px;
        }
    </style>
</head>

                desc: "苏州中学传媒中心「问道山下」校园广播 2026 年第 2 期。聚焦校园文化，讲述山中故事。",
                activity: "「问道山下」是苏州中学树莓社·苏中学生传媒中心出品的校园广播节目，每期围绕一个主题，带大家走进校园内外的有趣故事。",
                credits: [
                    { role: "出品", name: "树莓社 · 苏中学生传媒中心" },
                    { role: "主播", name: "校园广播站" },
                    { role: "后期制作", name: "树莓社" }
                ]
            },
            {
                id: "5",
                type: "audio",
                category: "campus",
                categoryName: "校园广播",
                title: "问道山下 · 2026第03期",
                cover: "276bb389037217dcacc5975db05b37aafb6fe791.jpg",
                audioSrc: "broadcast/问道山下_2026第03期_20260529-播客版.mp3",
                episodeDate: "2026年5月29日",
                duration: "15分钟",
                desc: "苏州中学传媒中心「问道山下」校园广播 2026 年第 3 期。聚焦校园文化，讲述山中故事。",
                activity: "「问道山下」是苏州中学树莓社·苏中学生传媒中心出品的校园广播节目，每期围绕一个主题，带大家走进校园内外的有趣故事。",
                credits: [
                    { role: "出品", name: "树莓社 · 苏中学生传媒中心" },
                    { role: "主播", name: "校园广播站" },
                    { role: "后期制作", name: "树莓社" }
                ]
            }
        ];

        // ==========================================
        // 逻辑控制代码
        // ==========================================
        let currentCategory = 'all';

        // 初始化页面
        window.addEventListener('DOMContentLoaded', () => {
            renderWorksList(worksData);
        });

        // 渲染列表
        function renderWorksList(data) {
            const grid = document.getElementById('worksGrid');
            grid.innerHTML = '';

            const filteredData = currentCategory === 'all' 
                ? data 
                : data.filter(item => item.category === currentCategory);

            if (filteredData.length === 0) {
                grid.innerHTML = '<div class="empty-state">该分类下暂无作品</div>';
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.onclick = () => openDetailView(item.id);

                card.innerHTML = `
                    <div class="card-cover-wrapper">
                        <img class="card-cover" src="${item.cover}" alt="${item.title}" loading="lazy">
                        <span class="card-tag">${item.categoryName}</span>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 分类筛选
        function filterCategory(category, btnElement) {
            currentCategory = category;
            
            // 更新 Tab 选中状态
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            renderWorksList(worksData);
        }

        let currentAudio = null;

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' + s : s}`;
        }

        function renderAudioPlayer(work) {
            const playerWrapper = document.getElementById('playerWrapper');
            playerWrapper.className = 'audio-player-container';
            playerWrapper.innerHTML = `
                <div class="audio-cover-wrapper" id="audioCoverWrapper">
                    <img src="${work.cover}" alt="${work.title}">
                    <div class="audio-badge">广播</div>
                </div>
                <div class="audio-info">
                    <div class="audio-episode">${work.episodeDate || ''}</div>
                    <div class="audio-player-title">${work.title}</div>
                    <div class="audio-player-subtitle">${work.duration || ''}</div>
                </div>
                <div class="audio-progress-container">
                    <span class="audio-time current" id="audioCurrentTime">0:00</span>
                    <div class="audio-progress-bar" id="audioProgressBar">
                        <div class="audio-progress-fill" id="audioProgressFill"></div>
                    </div>
                    <span class="audio-time duration" id="audioDuration">0:00</span>
                </div>
                <div class="audio-controls">
                    <button class="audio-ctrl-btn speed-btn" id="speedBtn" data-speed="1">1x</button>
                    <button class="audio-play-btn" id="audioPlayBtn">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="audio-ctrl-btn rewind-btn" id="rewindBtn" title="后退15秒">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9"/>
                            <polyline points="3 4 3 10 9 10"/>
                        </svg>
                    </button>
                </div>
                <audio id="audioElement" src="${work.audioSrc}" preload="metadata"></audio>
            `;

            const audio = document.getElementById('audioElement');
            const playBtn = document.getElementById('audioPlayBtn');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const progressBar = document.getElementById('audioProgressBar');
            const progressFill = document.getElementById('audioProgressFill');
            const currentTimeEl = document.getElementById('audioCurrentTime');
            const durationEl = document.getElementById('audioDuration');
            const speedBtn = document.getElementById('speedBtn');
            const rewindBtn = document.getElementById('rewindBtn');
            const coverWrapper = document.getElementById('audioCoverWrapper');

            if (currentAudio && currentAudio !== audio) {
                currentAudio.pause();
            }
            currentAudio = audio;

            audio.addEventListener('loadedmetadata', () => {
                durationEl.innerText = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.innerText = formatTime(audio.currentTime);
            });

            audio.addEventListener('play', () => {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                coverWrapper.classList.add('playing');
            });

            audio.addEventListener('pause', () => {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                coverWrapper.classList.remove('playing');
            });

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            });

            progressBar.addEventListener('click', (e) => {
                const rect = progressBar.getBoundingClientRect();
                const ratio = (e.clientX - rect.left) / rect.width;
                audio.currentTime = ratio * audio.duration;
            });

            const speeds = [1, 1.25, 1.5, 2];
            let speedIndex = 0;
            speedBtn.addEventListener('click', () => {
                speedIndex = (speedIndex + 1) % speeds.length;
                const newSpeed = speeds[speedIndex];
                audio.playbackRate = newSpeed;
                speedBtn.innerText = newSpeed + 'x';
                speedBtn.classList.toggle('active', newSpeed !== 1);
            });

            rewindBtn.addEventListener('click', () => {
                audio.currentTime = Math.max(0, audio.currentTime - 15);
            });
        }

        function renderVideoPlayer(work) {
            const playerWrapper = document.getElementById('playerWrapper');
            playerWrapper.className = 'video-player-container';
            playerWrapper.innerHTML = `
                <iframe 
                    src="${work.bilibiliSrc}" 
                    scrolling="no" 
                    border="0" 
                    frameborder="no" 
                    framespacing="0" 
                    allowfullscreen="true">
                </iframe>
            `;
        }

        // 打开详情页
        function openDetailView(workId) {
            const work = worksData.find(item => item.id === workId);
            if (!work) return;

            // 填写详情信息
            document.getElementById('detailTitle').innerText = work.title;
            document.getElementById('detailDesc').innerText = work.desc;
            document.getElementById('detailActivity').innerText = work.activity;

            // 根据类型渲染播放器
            if (work.type === 'audio') {
                renderAudioPlayer(work);
            } else {
                renderVideoPlayer(work);
            }

            // 渲染演职人员
            const creditsContainer = document.getElementById('detailCredits');
            creditsContainer.innerHTML = work.credits.map(c => `
                <div class="credit-item">
                    <span class="credit-role">${c.role}</span>
                    <span class="credit-name">${c.name}</span>
                </div>
            `).join('');

            // 切换视图
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('detail-view').classList.remove('fade-enter');
            void document.getElementById('detail-view').offsetWidth;
            document.getElementById('detail-view').classList.add('fade-enter');

            // 滚动到顶部
            window.scrollTo(0, 0);
        }

        // 返回列表页
        function showListView() {
            // 停止音频播放
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            // 清空播放器
            document.getElementById('playerWrapper').innerHTML = '';

            // 切换视图
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('list-view').classList.remove('fade-enter');
            void document.getElementById('list-view').offsetWidth;
            document.getElementById('list-view').classList.add('fade-enter');

            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
